  <section class="section band-white" id="fire-context">
    <div class="container">
      <div class="row g-4 g-lg-5 mb-4">
        <div class="col-lg-2">
          <p class="margin-label">
            <span class="num" aria-hidden="true">01</span>
            <span>The fire problem</span>

        </div>
        <div class="col-lg-8">
          <h2 class="section-title">A disaster that is mostly preventable</h2>
        </div>
      </div>

      <div class="row g-4 g-lg-5">
        <div class="col-lg-7">
          <p>
            Fire is the hazard Myanmar reports more often than any other. The Myanmar Fire
            Services Department usually records somewhere between about 900 and 2,100 fire
            outbreaks in a year. In 2022 alone there were 1,507 outbreaks, 96 deaths and 139
            injuries. Even one fire can wipe out a whole street of timber houses, and with it
            a family's savings.
          </p>
          <p>
            The causes, though, are ordinary and human: an unattended charcoal stove, an
            overloaded extension socket, a candle during a power cut, a cigarette stub, a field
            being cleared by burning. The Myanmar Fire Services Department leads prevention,
            firefighting, rescue and public awareness, working with township fire stations,
            auxiliary and volunteer firefighters, the Myanmar Red Cross Society and community
            groups.
          </p>
          <blockquote class="pull-quote">
            <span>“The major cause of fire cases in Myanmar is people's negligence when using fire.”</span>
            <cite>UN-Habitat Myanmar, Manual on Fire — Causes, Effects, Preparedness</cite>
          </blockquote>
        </div>

        <div class="col-lg-4 offset-lg-1">
          <p class="eyebrow">At a glance</p>
          <ul class="fact-list anim-list">
            <li><span class="k">Most frequent disaster</span>
                <span class="v">Fire (ahead of floods and cyclones)</span></li>
            <li><span class="k">Typical yearly total</span>
                <span class="v">About 900 – 2,100 outbreaks</span></li>
            <li><span class="k">Peak risk months</span>
                <span class="v">March to May (hot, dry season)</span></li>
            <li><span class="k">Highest-risk regions</span>
                <span class="v">Yangon, Mandalay, Ayeyarwady, Sagaing, Bago</span></li>
            <li><span class="k">Lead agency</span>
                <span class="v">Myanmar Fire Services Department</span></li>
            <li><span class="k">Emergency call</span>
                <span class="v"><strong>191</strong></span></li>
          </ul>
        </div>
      </div>
    </div>
